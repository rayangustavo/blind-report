name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Guardrails check
        run: npm run guardrails
      - name: Guardrails tests
        run: npm run test:guardrails
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & Coverage tests
        run: npm run test:coverage
